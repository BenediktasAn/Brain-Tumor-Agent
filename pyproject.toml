[project]
name = "brain-tumor-assistant"
version = "0.1.0"
description = "Educational multi-agent headache and brain-tumour triage chatbot (not a diagnostic tool)"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["realdata: needs the downloaded datasets (skipped when they are missing)"]
